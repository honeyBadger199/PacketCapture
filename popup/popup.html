<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAR Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="url(#grad)" stroke-width="2" fill="none"/>
          <circle cx="12" cy="12" r="4" fill="url(#grad)"/>
          <line x1="12" y1="2" x2="12" y2="6" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="18" x2="12" y2="22" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
          <line x1="2" y1="12" x2="6" y2="12" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
          <line x1="18" y1="12" x2="22" y2="12" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="24" y2="24">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#a855f7"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">HAR Capture</span>
      </div>
      <div class="status-indicator" id="statusIndicator">
        <span class="status-dot"></span>
        <span class="status-text" id="statusText">Idle</span>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-value" id="requestCount">0</div>
        <div class="stat-label">Requests</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalSize">0 B</div>
        <div class="stat-label">Total Size</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="elapsed">00:00</div>
        <div class="stat-label">Duration</div>
      </div>
    </div>

    <!-- Tab URL -->
    <div class="tab-info" id="tabInfo">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <span id="tabUrl" class="tab-url">No tab selected</span>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-primary" id="recordBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="8"/>
        </svg>
        <span>Start Recording</span>
      </button>

      <div class="secondary-controls">
        <button class="btn btn-secondary" id="exportBtn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7,10 12,15 17,10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Export HAR</span>
        </button>
        <button class="btn btn-ghost" id="clearBtn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3,6 5,6 21,6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
          <span>Clear</span>
        </button>
      </div>
    </div>

    <!-- Error message -->
    <div class="error-message" id="errorMessage"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
